      - run:
          name: Build relooper
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target relooperCfg -j2
      - run:
          name: Reconstruct control flow
          command: LIONSS_LP=1 ./build/relooperCfg --cfg cfg.txt
  miqp_branch:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
